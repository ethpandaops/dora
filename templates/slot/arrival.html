{{ define "block_arrival" }}
  <style>
    .arrival-group-badge {
      font-size: 0.66rem;
      padding: 0.12rem 0.4rem;
      border-radius: 0.3rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .arrival-dot {
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 50%;
      display: inline-block;
      flex: none;
      vertical-align: middle;
    }
    .arrival-table .mark-demo {
      display: inline-block;
      vertical-align: middle;
      position: relative;
      top: -1px;
      margin-right: 4px;
    }
    .num { font-variant-numeric: tabular-nums; white-space: nowrap; }

    .arrival-dist {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.4rem 1.1rem;
    }
    .arrival-dist .dist-bar {
      display: flex;
      width: 220px;
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
      flex: none;
      background: var(--bs-secondary-bg);
    }
    .arrival-dist .dist-bar > div { height: 100%; }
    .arrival-dist .entry { font-size: 0.85rem; white-space: nowrap; }

    .arrival-region-line {
      gap: 0.9rem;
      font-size: 0.85rem;
      padding: 0.1rem 0;
    }
    .arrival-region-line .region-name {
      flex: 0 1 8.5rem;
      min-width: 5rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .arrival-region-line .region-bar-track {
      display: inline-block;
      width: 160px;
      height: 8px;
      border-radius: 4px;
      background: var(--bs-secondary-bg);
      overflow: hidden;
    }
    .arrival-region-line .region-bar {
      display: block;
      height: 100%;
      border-radius: 4px;
    }

    .lane-track { position: relative; }
    /* shared gridlines: let arrival times be compared straight down the column */
    .lane-track .grid {
      position: absolute; top: 0; bottom: 0; width: 1px;
      background: var(--bs-border-color);
      opacity: 0.5;
    }
    /* connector from a node's first observation to its last, so the row shows
       how long the node's own pipeline took, not just when it started */
    .lane-track .span {
      position: absolute; top: 50%; height: 2px; margin-top: -1px;
      background: var(--bs-secondary-color);
      opacity: 0.45;
      border-radius: 1px;
    }
    .lane-track .mark {
      position: absolute; top: 50%; width: 7px; height: 7px;
      margin: -3.5px 0 0 -3.5px;
      border-radius: 50%;
      box-shadow: 0 0 0 1.5px var(--bs-body-bg);
    }
    .lane-track .mark.p2p { background: #9775fa; }
    .lane-track .mark.api { background: #5b8def; }
    .lane-track .tick-head {
      position: absolute; top: 50%; width: 2px; height: 11px;
      margin: -5.5px 0 0 -1px;
      background: #20c997;
      border-radius: 1px;
      box-shadow: 0 0 0 1.5px var(--bs-body-bg);
    }
    .lane-track .np {
      position: absolute; top: 50%; margin-top: 4px; height: 3px;
      min-width: 2px;
      background: #f1b44c;
      border-radius: 2px;
    }
    .lane-track .overflow {
      position: absolute; right: -2px; top: 50%; transform: translateY(-50%);
      font-size: 0.7rem; line-height: 1;
      color: var(--bs-secondary-color);
    }
    .arrival-axis-header {
      font-weight: 400;
      font-size: 0.63rem;
      color: var(--bs-secondary-color);
      font-variant-numeric: tabular-nums;
    }
    .arrival-axis-header .axis-line {
      height: 4px;
      position: relative;
      border-bottom: 1px solid var(--bs-border-color);
    }
    .arrival-axis-header .axis-line i {
      position: absolute; bottom: 0; width: 1px; height: 4px;
      background: var(--bs-border-color);
    }
    .arrival-axis-header .axis-labels {
      position: relative;
      height: 0.85rem;
      margin-top: 1px;
    }
    .arrival-axis-header .axis-labels > span {
      position: absolute; top: 0;
      white-space: nowrap;
    }

    .arrival-table td, .arrival-table th {
      vertical-align: middle;
      font-size: 0.8rem;
      white-space: nowrap;
    }
    .arrival-table thead th { vertical-align: bottom; }
    .arrival-table thead .group-row th {
      font-size: 0.66rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--bs-secondary-color);
      font-weight: 600;
      border-bottom: none;
      padding-bottom: 0.15rem;
    }
    .arrival-table thead .group-row th.layer {
      border-bottom: 1px solid var(--bs-border-color);
    }
    .arrival-table th.grp-start,
    .arrival-table td.grp-start {
      padding-left: 1.4rem;
    }
    .arrival-table tbody tr:nth-child(even) { background: var(--bs-tertiary-bg); }
    /* the page scrolls, not the table: a nested vertical scroller traps the
       wheel and hides how many nodes there are. Horizontal overflow is only
       enabled where it is needed, because overflow-x forces overflow-y to
       auto, and that scroll container would stop the header sticking to the
       page. */
    .arrival-scroll {
      border-bottom: 1px solid var(--bs-border-color);
      margin-bottom: 0.5rem;
    }
    @media (max-width: 991.98px) {
      .arrival-scroll { overflow-x: auto; }
    }
    /* Keeps the marker key and the time axis in view while reading down a
       long node list. The whole thead sticks as one unit: pinning each row
       separately meant computing where the first row ends, and any error
       there, including measuring before webfonts settle, leaves a seam that
       table rows scroll through. */
    .arrival-scroll thead {
      position: sticky;
      top: calc(var(--arrival-nav-h, 4.5rem) - 1px);
      /* above dora's header bar, whose drop shadow would otherwise paint a
         grey gradient across the pinned header. Its dropdowns still win. */
      z-index: 1001;
    }
    .arrival-scroll thead th {
      background: var(--bs-body-bg);
    }
    .arrival-scroll thead tr:last-child th {
      box-shadow: inset 0 -1px 0 var(--bs-border-color);
    }
    .arrival-node-name {
      max-width: 15rem; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; display: inline-block; vertical-align: middle;
    }
    .arrival-hide-np [data-col="np"] { display: none; }
    .arrival-table th.sortable { cursor: pointer; user-select: none; }
    .arrival-table th.sortable:hover { color: var(--bs-emphasis-color); }

    .arrival-wave-mini {
      position: relative;
      height: 40px;
      max-width: 520px;
      margin-top: 6px;
      border-bottom: 1px solid var(--bs-border-color);
    }
    .arrival-wave-mini svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .arrival-wave-mini .hover {
      position: absolute;
      top: 0;
      bottom: 0;
    }
    .arrival-wave-mini .deadline {
      position: absolute; top: 0; bottom: 0; width: 0;
      border-left: 1px dashed var(--bs-secondary-color);
    }
    .arrival-wave-mini .deadline-flag {
      position: absolute;
      top: -3px;
      padding-left: 5px;
      font-size: 0.63rem;
      color: var(--bs-secondary-color);
      white-space: nowrap;
    }
    .arrival-wave-axis {
      display: flex;
      justify-content: space-between;
      max-width: 520px;
      font-size: 0.63rem;
      color: var(--bs-secondary-color);
      font-variant-numeric: tabular-nums;
    }
  </style>

  <div id="arrival-content" class="card-body px-0 py-1">
    <div class="text-center p-4" id="arrival-loading">
      <div class="spinner-border spinner-border-sm me-2" role="status"></div>
      Loading propagation data from Xatu...
    </div>
    <div id="arrival-loaded" style="display: none;">
      <div id="arrival-empty" class="p-3 text-muted" style="display: none;"></div>
      <div id="arrival-rows-wrap" style="display: none;">
        <div class="row border-bottom p-2 mx-0">
          <div class="col-md-2"><span data-bs-toggle="tooltip" data-bs-placement="top" title="When nodes first observed this block, relative to slot start. Each node counts once with its earliest observation across all layers.">Arrival:</span></div>
          <div class="col-md-10" id="arrival-stats"></div>
        </div>
        <div class="row border-bottom p-2 mx-0">
          <div class="col-md-2"><span data-bs-toggle="tooltip" data-bs-placement="top" title="Raw observation counts per source layer">Observations:</span></div>
          <div class="col-md-10" id="arrival-observations"></div>
        </div>
        <div class="row border-bottom p-2 mx-0">
          <div class="col-md-2"><span data-bs-toggle="tooltip" data-bs-placement="top" title="Who runs the observing nodes">Sources:</span></div>
          <div class="col-md-10" id="arrival-sources"></div>
        </div>
        <div class="row border-bottom p-2 mx-0">
          <div class="col-md-2"><span data-bs-toggle="tooltip" data-bs-placement="top" title="Observing nodes per continent, with the region's earliest observation">Regions:</span></div>
          <div class="col-md-10" id="arrival-regions"></div>
        </div>
        {{ if .XatuCbtEnabled }}
        <div class="row border-bottom p-2 mx-0" id="waves-att" style="display: none;">
          <div class="col-md-2"><span data-bs-toggle="tooltip" data-bs-placement="top" title="When the network first saw this slot's attestations, in 50ms buckets. Votes for other roots mean those attesters had not imported this block in time.">Attestations:</span></div>
          <div class="col-md-10" id="waves-att-body"></div>
        </div>
        <div class="row border-bottom p-2 mx-0" id="waves-cols" style="display: none;">
          <div class="col-md-2"><span data-bs-toggle="tooltip" data-bs-placement="top" title="PeerDAS data column sidecars: when each of the 128 columns of this block's blob data was first seen, and how available each measured under custody probing.">Data columns:</span></div>
          <div class="col-md-10" id="waves-cols-body"></div>
        </div>
        {{ end }}
        <div id="arrival-body" class="px-2 pt-1"></div>
      </div>
    </div>
    <div class="text-muted small px-2 pb-2 d-flex align-items-center" style="gap: 6px;">
      <img src="/images/xatu.png" alt="Xatu" style="width: 18px; height: 18px;" />
      Data from <a href="https://github.com/ethpandaops/xatu" target="_blank" rel="noopener">Xatu</a>
    </div>
  </div>

  <script type="text/javascript">
    (function() {
      var arrivalSlot = {{ .Slot }};
      // Scopes the query to this block, so a slot with competing blocks shows
      // each block's own propagation instead of both merged together.
      var arrivalBlockRoot = "0x{{ printf "%x" .Block.BlockRoot }}";
      var arrivalLoaded = false;
      var arrivalData = null;
      var sortState = { key: 'min', dir: 1 };

      var continentColors = {
        EU: '#5b8def', NA: '#34c38f', AS: '#f1b44c',
        OC: '#50c3e6', SA: '#a78bfa', AF: '#f46a6a'
      };
      var continentNames = {
        EU: 'Europe', NA: 'North America', AS: 'Asia',
        OC: 'Oceania', SA: 'South America', AF: 'Africa'
      };
      var groupStyles = {
        ethpandaops: { label: 'EF', cls: 'text-bg-primary' },
        community:   { label: 'community', cls: 'text-bg-success' },
        corp:        { label: 'corp', cls: 'text-bg-warning' },
        other:       { label: 'other', cls: 'text-bg-secondary' }
      };

      function esc(s) {
        return String(s).replace(/[&<>"']/g, function(c) {
          return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c];
        });
      }
      function fmtStr(ms) {
        if (ms >= 1000) return (ms / 1000).toFixed(2) + 's';
        return ms + 'ms';
      }
      // Axis ticks are round numbers, so drop the trailing zeroes fmtStr keeps.
      function fmtAxis(ms) {
        if (ms < 1000) return ms + 'ms';
        return String(+(ms / 1000).toFixed(2)) + 's';
      }
      // Thresholds and colors are duplicated in FormatArrivalMs in
      // utils/format.go, which colors the same values server side for the
      // epoch page; change both together.
      function timeColor(ms) {
        if (ms < 1000) return '#34c38f';
        if (ms < 2000) return '#7bc96f';
        if (ms < 3000) return '#f1b44c';
        if (ms < 4000) return '#f0824c';
        return '#f46a6a';
      }
      function fmtMsColored(ms) {
        if (ms == null) return '<span class="text-muted">&mdash;</span>';
        return '<span class="num" style="color:' + timeColor(ms) + '">' + fmtStr(ms) + '</span>';
      }
      function fmtDelta(ms) {
        if (ms == null) return '<span class="text-muted">&mdash;</span>';
        var sign = ms < 0 ? '&minus;' : '+';
        return '<span class="text-muted">' + sign + Math.abs(ms) + 'ms</span>';
      }
      function flag(cc) {
        if (!cc || cc.length !== 2) return '';
        var A = 0x1F1E6;
        return String.fromCodePoint(A + cc.charCodeAt(0) - 65, A + cc.charCodeAt(1) - 65);
      }
      function contColor(code) { return continentColors[code] || '#74788d'; }
      function nodeTimes(n) {
        return [n.api_ms, n.p2p_ms, n.head_ms, n.np_ms].filter(function(v) { return v != null; });
      }
      function groupBadge(g) {
        var st = groupStyles[g] || groupStyles.other;
        return '<span class="arrival-group-badge ' + st.cls + ' me-1">' + st.label + '</span>';
      }

      // distBar renders a proportional stacked bar plus aligned legend entries:
      // segments = [{count, color, title, legend}]
      function distBar(segments) {
        var total = 0;
        segments.forEach(function(seg) { total += seg.count; });
        if (!total) return '';

        var bar = segments.map(function(seg) {
          var w = (seg.count / total * 100).toFixed(2);
          return '<div style="width:' + w + '%;background:' + seg.color + '" title="' + seg.title + '"></div>';
        }).join('');

        var entries = segments.map(function(seg) {
          return '<span class="entry">' + seg.legend + '</span>';
        }).join('');

        return '<div class="arrival-dist"><div class="dist-bar">' + bar + '</div>' + entries + '</div>';
      }

      // Shared time axis for the per-row lanes. Zoomed to where the
      // observations actually sit rather than anchored at slot start: real
      // arrivals cluster inside a few hundred milliseconds, and starting at
      // zero renders every row the same length.
      //
      // Bounds come from the values actually drawn, not from the arrival
      // stats. Those stats describe each node's earliest sighting, while a
      // lane also plots the block event, the head event and the newPayload
      // window, which are all later by definition, so scaling to them piled
      // marks onto the right edge. Late nodes stay out: one stalled node
      // reporting tens of seconds would flatten everything else.
      function axis(s, nodes) {
        var vals = [];

        (nodes || []).forEach(function(n) {
          if (n.late) return;

          nodeTimes(n).forEach(function(v) { vals.push(v); });

          if (n.np_ms != null && n.np_dur_ms) vals.push(n.np_ms + n.np_dur_ms);
        });

        vals.sort(function(a, b) { return a - b; });

        var first = vals.length ? vals[0] : s.min_ms;
        // p95 rather than the maximum: a couple of stragglers should not cost
        // the whole width, and anything past the edge keeps its chevron
        var last = vals.length ? vals[Math.floor((vals.length - 1) * 0.95)] : s.p90_ms;
        var spread = Math.max(40, last - first);
        var lo = Math.max(0, first - spread * 0.05);
        var hi = last + spread * 0.12;
        var span = Math.max(1, hi - lo);
        var steps = [10, 25, 50, 100, 250, 500, 1000, 2500];
        var step = steps[steps.length - 1];

        for (var i = 0; i < steps.length; i++) {
          if (span / steps[i] <= 6) { step = steps[i]; break; }
        }

        var lines = [];
        for (var t = Math.ceil(lo / step) * step; t < hi; t += step) {
          if (t > lo) lines.push(t);
        }

        return { lo: lo, hi: hi, span: span, step: step, lines: lines };
      }

      function sortInd(key) {
        if (sortState.key !== key) return '';
        return ' <span class="text-muted">' + (sortState.dir > 0 ? '&uarr;' : '&darr;') + '</span>';
      }
      function nodeSortValue(n, key) {
        switch (key) {
          case 'name': return (n.name || '').toLowerCase();
          case 'impl': return (n.implementation || '').toLowerCase() || null;
          case 'cc': return ((n.country_code || n.continent || '').toLowerCase()) || null;
          case 'p2p': return n.p2p_ms != null ? n.p2p_ms : null;
          case 'api': return n.api_ms != null ? n.api_ms : null;
          case 'dv': return (n.api_ms != null && n.p2p_ms != null) ? n.api_ms - n.p2p_ms : null;
          case 'head': return n.head_ms != null ? n.head_ms : null;
          case 'np': return n.np_ms != null ? n.np_ms : null;
          default: return n.min_ms;
        }
      }
      // Sorts a copy: missing values always last, earliest arrival breaks ties.
      function sortedNodes(nodes) {
        var arr = nodes.slice();
        arr.sort(function(a, b) {
          var va = nodeSortValue(a, sortState.key);
          var vb = nodeSortValue(b, sortState.key);
          if (va == null && vb == null) return a.min_ms - b.min_ms;
          if (va == null) return 1;
          if (vb == null) return -1;
          if (va < vb) return -sortState.dir;
          if (va > vb) return sortState.dir;
          return a.min_ms - b.min_ms;
        });
        return arr;
      }

      function laneMarks(n, pos, ax) {
        var html = '';

        ax.lines.forEach(function(t) {
          html += '<div class="grid" style="left:' + pos(t) + '%"></div>';
        });

        var times = nodeTimes(n);
        if (!times.length) return html;

        // one grammar for every row: a connector across the node's own events,
        // with a mark per event. A node reporting a single event is a single
        // mark, which is the normal case for a beacon-API-only sentry.
        var first = Math.min.apply(null, times);
        var last = Math.max.apply(null, times);

        if (last > first) {
          var a = pos(first);
          var b = pos(last);
          html += '<div class="span" style="left:' + a + '%;width:' + Math.max(0, b - a) + '%"></div>';
        }

        if (n.np_ms != null) {
          var npLo = pos(n.np_ms);
          var npHi = Math.max(npLo + 0.4, pos(n.np_ms + (n.np_dur_ms || 0)));
          html += '<div class="np" style="left:' + npLo + '%;width:' + (npHi - npLo) +
            '%" title="engine newPayload ' + fmtStr(n.np_ms) + ' &rarr; ' +
            fmtStr(n.np_ms + (n.np_dur_ms || 0)) + ' (' + (n.np_dur_ms || 0) + 'ms, ' +
            esc(n.np_status || '') + ')"></div>';
        }

        if (n.p2p_ms != null) {
          html += '<div class="mark p2p" style="left:' + pos(n.p2p_ms) +
            '%" title="libp2p block gossip ' + fmtStr(n.p2p_ms) + '"></div>';
        }

        if (n.api_ms != null) {
          var tip = 'beacon api block event ' + fmtStr(n.api_ms);
          if (n.p2p_ms != null && n.api_ms > n.p2p_ms) {
            tip += ' &middot; verify +' + (n.api_ms - n.p2p_ms) + 'ms after gossip';
          }
          html += '<div class="mark api" style="left:' + pos(n.api_ms) + '%" title="' + tip + '"></div>';
        }

        if (n.head_ms != null) {
          html += '<div class="tick-head" style="left:' + pos(n.head_ms) +
            '%" title="head event ' + fmtStr(n.head_ms) + '"></div>';
        }

        return html;
      }

      function laneOverflows(n, ax) {
        var last = Math.max.apply(null, nodeTimes(n));
        return last > ax.hi;
      }

      // Ruler above the lanes; ticks line up with the per-row gridlines.
      function axisHeader(ax, ind) {
        var pos = function(ms) { return (ms - ax.lo) / ax.span * 100; };
        var ticks = '';
        var labels = '<span style="left:0">' + fmtAxis(ax.lo) + '</span>';

        ax.lines.forEach(function(t) {
          var at = pos(t);
          ticks += '<i style="left:' + at + '%"></i>';

          // the window hugs the data, so the first gridline can sit almost on
          // top of the start label; leave the tick, drop the crowded label
          if (at > 12 && at < 88) {
            labels += '<span style="left:' + at + '%;transform:translateX(-50%)">' + fmtAxis(t) + '</span>';
          }
        });

        return '<div class="arrival-axis-header"><div class="axis-line">' + ticks + '</div>' +
          '<div class="axis-labels">' + labels +
          '<span style="right:0">' + fmtAxis(ax.hi) + ind + '</span></div></div>';
      }

      function renderTable(data) {
        var s = data.stats;
        var ax = axis(s, data.nodes);
        var pos = function(ms) { return Math.min(100, Math.max(0, (ms - ax.lo) / ax.span * 100)); };

        var rows = sortedNodes(data.nodes).map(function(n) {
          var cc = (n.country_code || '').toUpperCase();
          var dVerify = (n.api_ms != null && n.p2p_ms != null) ? n.api_ms - n.p2p_ms : null;

          var np = '<span class="text-muted">&mdash;</span>';
          if (n.np_ms != null) {
            np = '<span class="num" style="color:' + timeColor(n.np_ms) + '" title="' + esc(n.np_status || '') + '">' + fmtStr(n.np_ms) + '</span>' +
              ' <span class="text-muted small">+' + n.np_dur_ms + 'ms</span>';
          }

          var last = n.late
            ? '<td class="grp-start"><span class="badge rounded-pill text-bg-danger" style="font-size: 11px;" title="Earliest observation ' + fmtStr(n.min_ms) +
              ' after slot start — likely a syncing or stalled node">late &middot; ' + fmtStr(n.min_ms) + '</span></td>'
            : '<td class="grp-start"><div class="lane-track" style="height: 18px; min-width: 16rem">' + laneMarks(n, pos, ax) +
              (laneOverflows(n, ax) ? '<span class="overflow" title="continues past the axis">&raquo;</span>' : '') + '</div></td>';

          return '<tr' + (n.late ? ' class="text-muted"' : '') + '>' +
            '<td class="text-nowrap">' + groupBadge(n.group) +
            '<span class="arrival-node-name" title="' + esc(n.full_name) + '">' + esc(n.name) + '</span></td>' +
            '<td>' + (n.implementation ? esc(n.implementation) : '<span class="text-muted" title="Not a beacon node — a gossip listener observing the p2p wire">&mdash;</span>') + '</td>' +
            '<td title="' + esc(n.country || '') + '">' + flag(cc) + ' <span class="text-muted small">' + esc(cc || n.continent || '') + '</span></td>' +
            '<td class="text-end grp-start">' + fmtMsColored(n.p2p_ms) + '</td>' +
            '<td class="text-end grp-start">' + fmtMsColored(n.api_ms) + '</td>' +
            '<td class="text-end num">' + fmtDelta(dVerify) + '</td>' +
            '<td class="text-end">' + fmtMsColored(n.head_ms) + '</td>' +
            '<td class="text-end grp-start" data-col="np">' + np + '</td>' +
            last + '</tr>';
        }).join('');

        return '<div class="arrival-scroll">' +
          '<table class="table table-sm arrival-table text-left mb-1' + (data.np_observations ? '' : ' arrival-hide-np') + '">' +
          '<thead>' +
          '<tr class="group-row">' +
          '<th></th><th></th><th></th>' +
          '<th class="text-end layer grp-start" title="Seen by the node&#39;s gossipsub listener: the raw beacon_block message on the wire, before verification">libp2p</th>' +
          '<th colspan="3" class="text-center layer grp-start" title="The node&#39;s beacon API event stream: emitted after the block is fully verified and imported">beacon api</th>' +
          '<th class="text-end layer grp-start" data-col="np" title="Observed on the engine API between the consensus and execution client">engine api</th>' +
          '<th class="text-center layer grp-start">timeline</th></tr>' +
          '<tr>' +
          '<th style="width: 18rem" class="sortable" data-sort="name">Node' + sortInd('name') + '</th>' +
          '<th class="sortable" data-sort="impl">Client' + sortInd('impl') + '</th>' +
          '<th style="width: 5rem" class="sortable" data-sort="cc">Loc' + sortInd('cc') + '</th>' +
          '<th class="text-end grp-start sortable" data-sort="p2p" title="First beacon_block gossip message seen on the libp2p wire — pre-verification">' +
          '<span class="mark-demo" style="width:12px;height:7px;background:#9775fa;border-radius:2px"></span>Block&nbsp;gossip' + sortInd('p2p') + '</th>' +
          '<th class="text-end grp-start sortable" data-sort="api" title="Block event on the beacon API — the node has fully verified and imported the block">' +
          '<span class="mark-demo" style="width:12px;height:7px;background:#5b8def;border-radius:2px"></span>Block event' + sortInd('api') + '</th>' +
          '<th class="text-end sortable" data-sort="dv" title="Block gossip arrival to block event: verification and import cost">&Delta;&nbsp;verify' + sortInd('dv') + '</th>' +
          '<th class="text-end sortable" data-sort="head" title="Head event on the beacon API — the node adopted the block as chain head via fork choice">' +
          '<span class="mark-demo" style="width:2px;height:10px;background:#20c997;border-radius:1px"></span>Head event' + sortInd('head') + '</th>' +
          '<th class="text-end grp-start sortable" data-sort="np" data-col="np" title="engine_newPayload call start (observed completion minus call duration) · how long the execution client took to import">' +
          '<span class="mark-demo" style="width:12px;height:7px;background:#f1b44c;border-radius:2px"></span>newPayload' + sortInd('np') + '</th>' +
          '<th class="grp-start sortable" data-sort="min" style="min-width: 16rem" title="Every node on one axis running from slot start, so bar length is the time the node took to have the block in hand">' +
          axisHeader(ax, sortInd('min')) + '</th>' +
          '</tr></thead><tbody>' + rows + '</tbody></table></div>';
      }

      // Keeps the two sticky header rows flush: any mismatch leaves a gap that
      // table rows scroll through behind the header.
      function syncStickyOffsets() {
        var wrap = document.querySelector('.arrival-scroll');
        var bar = document.querySelector('.header-bar');
        if (!wrap || !bar) return;

        var navH = Math.round(bar.getBoundingClientRect().height);
        if (navH > 0) wrap.style.setProperty('--arrival-nav-h', navH + 'px');
      }

      window.addEventListener('resize', syncStickyOffsets);

      // the header bar's height is not final until its webfonts land
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(syncStickyOffsets);
      }

      function render(data) {
        arrivalData = data;
        document.getElementById('arrival-loading').style.display = 'none';
        document.getElementById('arrival-loaded').style.display = '';

        if (!data.nodes || !data.nodes.length) {
          var empty = document.getElementById('arrival-empty');
          empty.style.display = '';
          empty.innerHTML = 'No propagation observations for this slot' + (data.settled ? '.' : ' yet.');
          return;
        }

        document.getElementById('arrival-rows-wrap').style.display = '';

        var s = data.stats;
        var statParts = [];
        [['fastest', s.min_ms], ['median', s.p50_ms], ['p90', s.p90_ms], ['slowest', s.max_ms]].forEach(function(kv) {
          statParts.push('<span class="num" style="color:' + timeColor(kv[1]) + '"><b>' + fmtStr(kv[1]) + '</b></span> <span class="text-muted">' + kv[0] + '</span>');
        });
        document.getElementById('arrival-stats').innerHTML = statParts.join('<span class="text-muted px-2">&middot;</span>');

        var obs = '<b>' + s.unique_nodes + '</b> nodes &mdash; ' +
          data.observations + ' block / ' + data.p2p_observations + ' block gossip / ' + data.head_observations + ' head / ' +
          data.np_observations + ' engine observations';
        if (s.late_nodes > 0) {
          obs += ' <span class="badge rounded-pill text-bg-danger ms-1" style="font-size: 11px;" title="Nodes whose earliest observation came more than a slot after slot start; excluded from stats">' +
            s.late_nodes + ' late node' + (s.late_nodes > 1 ? 's' : '') + '</span>';
        }
        if (!data.settled) {
          obs += ' <span class="badge rounded-pill text-bg-info ms-1" style="font-size: 11px;">live &mdash; data may still be arriving</span>';
        }
        document.getElementById('arrival-observations').innerHTML = obs;

        var groupColors = { ethpandaops: '#0d6efd', community: '#198754', corp: '#ffc107', other: '#6c757d' };
        document.getElementById('arrival-sources').innerHTML = distBar((data.groups || []).map(function(g) {
          var st = groupStyles[g.name] || groupStyles.other;
          return {
            count: g.nodes,
            color: groupColors[g.name] || groupColors.other,
            title: st.label + ': ' + g.nodes + ' nodes, p50 ' + fmtStr(g.p50_ms),
            legend: '<span class="arrival-group-badge ' + st.cls + '">' + st.label + '</span> <b>' + g.nodes + '</b>' +
              ' <span class="text-muted small">p50 ' + fmtStr(g.p50_ms) + '</span>'
          };
        }));

        var totalNodes = s.unique_nodes || 1;
        document.getElementById('arrival-regions').innerHTML = (data.continents || []).map(function(c) {
          var share = Math.max(1.5, c.nodes / totalNodes * 100);
          var name = continentNames[c.code] || c.code || 'Unknown';
          return '<div class="d-flex align-items-center arrival-region-line">' +
            '<span class="region-name"><span class="arrival-dot me-1" style="background:' + contColor(c.code) + '"></span>' + esc(name) + '</span>' +
            '<span class="region-bar-track d-none d-md-inline-block" style="flex: none"><span class="region-bar" style="width:' + share.toFixed(1) + '%;background:' + contColor(c.code) + '"></span></span>' +
            '<span class="num" style="width: 4.5rem; flex: none; text-align: right"><b>' + c.nodes + '</b> <span class="text-muted small">node' + (c.nodes > 1 ? 's' : '') + '</span></span>' +
            '<span class="num" style="width: 7rem; flex: none; text-align: right"><span class="text-muted small">first</span> ' + fmtMsColored(c.min_ms) + '</span>' +
            '<span class="num d-none d-sm-inline" style="width: 6.5rem; flex: none; text-align: right"><span class="text-muted small">p50</span> ' + fmtMsColored(c.p50_ms) + '</span>' +
            '<span class="num d-none d-sm-inline" style="width: 6.5rem; flex: none; text-align: right"><span class="text-muted small">p90</span> ' + fmtMsColored(c.p90_ms) + '</span>' +
            '<span class="num d-none d-md-inline" style="width: 6.5rem; flex: none; text-align: right"><span class="text-muted small">max</span> ' + fmtMsColored(c.max_ms) + '</span>' +
            '</div>';
        }).join('');

        document.getElementById('arrival-body').innerHTML = renderTable(data);
        requestAnimationFrame(syncStickyOffsets);
      }

      // The wave rows join the summary block above the table, so they follow
      // its grammar: numbers first, one small muted visual under them.
      function liveBadge(settled) {
        if (settled) return '';
        return ' <span class="badge rounded-pill text-bg-info ms-1" style="font-size: 11px;">live &mdash; data may still be arriving</span>';
      }

      var sep = '<span class="text-muted px-2">&middot;</span>';

      function renderAttWave(att, settled) {
        if (!att.total_count) return;

        var viewed = null;
        var otherCount = 0;
        var otherRoots = [];

        (att.roots || []).forEach(function(r) {
          if (r.viewed) { viewed = r; return; }
          otherCount += r.count;
          otherRoots.push(r.root ? r.root.slice(0, 10) + '\u2026' : 'smaller roots');
        });

        var chunks = {};
        var lo = null, hi = null, peak = 0;

        (att.roots || []).forEach(function(r) {
          (r.buckets || []).forEach(function(b) {
            var c = chunks[b.ms] || (chunks[b.ms] = { viewed: 0, other: 0 });
            c[r.viewed ? 'viewed' : 'other'] += b.count;
            if (lo == null || b.ms < lo) lo = b.ms;
            if (hi == null || b.ms > hi) hi = b.ms;
            if (c.viewed + c.other > peak) peak = c.viewed + c.other;
          });
        });
        if (lo == null || !peak) return;

        document.getElementById('waves-att').style.display = '';

        var stats = '<b>' + att.total_count.toLocaleString() + '</b> attestations first seen';
        if (viewed) {
          stats += sep + '<span class="num" style="color:#34c38f"><b>' +
            (viewed.count / att.total_count * 100).toFixed(1) + '%</b></span> <span class="text-muted">vote this block</span>';
        }
        if (otherCount > 0) {
          stats += sep + '<span class="num" style="color:#f46a6a" title="' + esc(otherRoots.join(', ')) + '"><b>' +
            otherCount.toLocaleString() + '</b></span> <span class="text-muted">vote other roots</span>';
        }

        var axLo = Math.max(0, lo - 100);
        var axHi = hi + 150;
        var span = Math.max(1, axHi - axLo);
        var pos = function(ms) { return (ms - axLo) / span * 100; };

        // the silhouette is one smooth area rather than 50ms picket bars: a
        // polygon through the bucket midpoints, with zero buckets pinned just
        // under the viewBox so quiet stretches show no line at all
        var W = 100, H = 40;
        var px = function(ms) { return (pos(ms + 25)).toFixed(2); };
        var py = function(v) {
          if (!v) return (H + 1.5).toFixed(2);
          return (H - Math.max(1, v / peak * (H - 4))).toFixed(2);
        };

        var viewedPts = [], totalPts = [], hovers = '';
        for (var ms = lo; ms <= hi; ms += 50) {
          var c = chunks[ms] || { viewed: 0, other: 0 };
          viewedPts.push(px(ms) + ',' + py(c.viewed));
          totalPts.push(px(ms) + ',' + py(c.viewed + c.other));

          if (c.viewed + c.other > 0) {
            hovers += '<div class="hover" style="left:' + pos(ms) + '%;width:' + (50 / span * 100) +
              '%" title="' + fmtStr(ms) + '\u2013' + fmtStr(ms + 50) + ': ' + (c.viewed + c.other).toLocaleString() +
              ' attestations' + (c.other ? ' (' + c.other.toLocaleString() + ' for other roots)' : '') + '"></div>';
          }
        }

        var area = function(pts, fill, stroke) {
          var edge = (H + 2).toFixed(2);
          return '<polygon points="' + pts[0].split(',')[0] + ',' + edge + ' ' + pts.join(' ') + ' ' +
            pts[pts.length - 1].split(',')[0] + ',' + edge + '" fill="' + fill + '"/>' +
            '<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + stroke +
            '" stroke-width="1.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>';
        };

        var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">';
        if (otherCount > 0) {
          // wrong-head votes fill only the band between the two lines, so the
          // fills never stack into a muddy overlap
          svg += '<polygon points="' + totalPts.join(' ') + ' ' + viewedPts.slice().reverse().join(' ') +
            '" fill="rgba(244,106,106,0.55)"/>';
        }
        svg += area(viewedPts, 'rgba(52,195,143,0.25)', '#34c38f') + '</svg>';

        var deadline = '';
        if (att.deadline_ms > axLo && att.deadline_ms < axHi) {
          deadline = '<div class="deadline" style="left:' + pos(att.deadline_ms) +
            '%" title="One third into the slot: validators attest now even without a block in hand">' +
            '<span class="deadline-flag">' + fmtAxis(att.deadline_ms) + ' deadline</span></div>';
        }

        document.getElementById('waves-att-body').innerHTML = stats + liveBadge(settled) +
          '<div class="arrival-wave-mini">' + svg + deadline + hovers + '</div>' +
          '<div class="arrival-wave-axis"><span>' + fmtAxis(axLo) + '</span><span>' + fmtAxis(axHi) + '</span></div>';
      }

      function renderColWave(cols, settled) {
        var entries = cols.columns || [];
        if (!entries.length || !cols.blob_count) return;

        document.getElementById('waves-cols').style.display = '';

        var stats = '<b>' + cols.blob_count + '</b> blob' + (cols.blob_count > 1 ? 's' : '') +
          sep + '<b>' + cols.seen_columns + '</b><span class="text-muted">/' + entries.length + ' columns seen</span>';
        if (cols.seen_columns > 0) {
          stats += sep + fmtMsColored(cols.first_ms) + ' <span class="text-muted">&rarr;</span> ' + fmtMsColored(cols.last_ms);
        }
        if (cols.probed_columns > 0) {
          var availColor = cols.min_availability < 100 ? '#f1b44c' : '#34c38f';
          stats += sep + '<span class="num" style="color:' + availColor + '"><b>' + cols.avg_availability.toFixed(1) +
            '%</b></span> <span class="text-muted">available (' + cols.total_probes.toLocaleString() + ' probes)</span>';
          if (cols.min_availability < 100) {
            stats += ' <span class="text-muted small">worst column ' + cols.min_availability.toFixed(1) + '%</span>';
          }
        }

        var seen = entries.map(function(c) { return c.first_seen_ms; })
          .filter(function(v) { return v != null; })
          .sort(function(a, b) { return a - b; });
        if (!seen.length) {
          document.getElementById('waves-cols-body').innerHTML = stats + liveBadge(settled);
          return;
        }

        // cumulative columns-seen-over-time, zoomed to the burst. The y scale
        // is all columns, so an incomplete set visibly plateaus below the top.
        var total = entries.length;
        var spread = Math.max(40, seen[seen.length - 1] - seen[0]);
        var axLo = Math.max(0, seen[0] - spread * 0.06);
        var axHi = seen[seen.length - 1] + spread * 0.12;
        var span = Math.max(1, axHi - axLo);
        var pos = function(ms) { return (ms - axLo) / span * 100; };

        var W = 100, H = 40;
        var px = function(ms) { return pos(ms).toFixed(2); };
        var py = function(v) { return (H - Math.max(0, v / total * (H - 4))).toFixed(2); };

        var pts = [px(seen[0]) + ',' + py(0)];
        seen.forEach(function(ms, i) {
          pts.push(px(ms) + ',' + py(i + 1));
        });
        pts.push(px(axHi) + ',' + py(seen.length));

        var edge = (H + 2).toFixed(2);
        var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' +
          '<polygon points="' + px(seen[0]) + ',' + edge + ' ' + pts.join(' ') + ' ' + px(axHi) + ',' + edge +
          '" fill="rgba(52,195,143,0.25)"/>' +
          '<polyline points="' + pts.join(' ') + '" fill="none" stroke="#34c38f"' +
          ' stroke-width="1.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>';

        // hover bins report how much of the set had spread by each moment
        var hovers = '';
        var bins = 24;
        for (var b = 0; b < bins; b++) {
          var upto = axLo + span * (b + 1) / bins;
          var count = 0;
          while (count < seen.length && seen[count] <= upto) count++;
          hovers += '<div class="hover" style="left:' + (b / bins * 100) + '%;width:' + (100 / bins) +
            '%" title="' + count + '/' + total + ' columns seen by ' + fmtStr(Math.round(upto)) + '"></div>';
        }

        document.getElementById('waves-cols-body').innerHTML = stats + liveBadge(settled) +
          '<div class="arrival-wave-mini">' + svg + hovers + '</div>' +
          '<div class="arrival-wave-axis"><span>' + fmtAxis(Math.round(axLo)) + '</span><span>' + fmtAxis(Math.round(axHi)) + '</span></div>';
      }

      function renderWaves(data) {
        if (data.attestations) renderAttWave(data.attestations, data.settled);
        if (data.columns) renderColWave(data.columns, data.settled);
      }

      var wavesLoaded = false;

      // The wave panels stay hidden when the fetch fails or returns nothing:
      // they are additive context, so their failure should not add noise to
      // the arrival panel above them.
      function loadWaves() {
        if (wavesLoaded || !document.getElementById('waves-att')) return;
        wavesLoaded = true;
        fetch('/slot/' + arrivalSlot + '/waves?root=' + encodeURIComponent(arrivalBlockRoot))
          .then(function(r) {
            if (!r.ok) throw new Error('status ' + r.status);
            return r.json();
          })
          .then(renderWaves)
          .catch(function() {});
      }

      function loadArrival() {
        if (arrivalLoaded) return;
        arrivalLoaded = true;
        loadWaves();
        fetch('/slot/' + arrivalSlot + '/arrival?root=' + encodeURIComponent(arrivalBlockRoot))
          .then(function(r) {
            if (!r.ok) throw new Error('status ' + r.status);
            return r.json();
          })
          .then(render)
          .catch(function(err) {
            document.getElementById('arrival-loading').innerHTML =
              '<span class="text-danger">Failed to load propagation data: ' + esc(err.message) + '</span>';
          });
      }

      document.getElementById('arrival-body').addEventListener('click', function(ev) {
        var th = ev.target.closest('th[data-sort]');
        if (!th || !arrivalData) return;
        var key = th.getAttribute('data-sort');
        if (sortState.key === key) {
          sortState.dir = -sortState.dir;
        } else {
          sortState.key = key;
          sortState.dir = 1;
        }
        document.getElementById('arrival-body').innerHTML = renderTable(arrivalData);
        requestAnimationFrame(syncStickyOffsets);
      });

      var tab = document.getElementById('arrival-tab');
      if (tab) {
        tab.addEventListener('shown.bs.tab', loadArrival);
        // Load immediately when the tab is preselected via url hash. The page
        // header script strips the fragment before this runs (to avoid the
        // browser's scroll-to-fragment) and stashes it in __doraInitialHash.
        if (window.location.hash === '#arrival' || window.__doraInitialHash === '#arrival') loadArrival();
      }
    })();
  </script>
{{ end }}
