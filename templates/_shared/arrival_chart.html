{{ define "arrival_chart" }}
  <style>
    .num { font-variant-numeric: tabular-nums; white-space: nowrap; }

    .arrival-hist {
      position: relative;
      height: 110px;
      margin-top: 8px;
      border-left: 1px solid var(--bs-border-color);
      border-bottom: 1px solid var(--bs-border-color);
    }
    .arrival-hist.hist-sm { height: 72px; }
    .arrival-hist.hist-tall { height: 210px; }
    /* legend entries double as series filters */
    .tl-toggle { cursor: pointer; }
    .tl-toggle:hover { text-decoration: underline dotted; text-underline-offset: 3px; }
    .tl-toggle.off { opacity: 0.35; }
    .arrival-hist .grid {
      position: absolute; top: 0; bottom: 0; width: 1px;
      background: var(--bs-border-color);
      opacity: 0.45;
    }
    .arrival-hist .bar { position: absolute; bottom: 0; }
    .arrival-hist .deadline {
      position: absolute; top: 0; bottom: 0; width: 0;
      border-left: 2px dashed #f46a6a;
      opacity: 0.9;
    }
    .arrival-hist .deadline .note {
      position: absolute;
      top: 1px;
      padding-left: 5px;
      font-size: 0.63rem;
      color: var(--bs-secondary-color);
      white-space: nowrap;
      text-shadow: 0 0 3px var(--bs-body-bg), 0 0 3px var(--bs-body-bg), 0 0 3px var(--bs-body-bg);
    }
    .arrival-hist-axis {
      position: relative;
      height: 0.95rem;
      font-size: 0.63rem;
      color: var(--bs-secondary-color);
      font-variant-numeric: tabular-nums;
    }
    .arrival-hist-axis > span {
      position: absolute;
      top: 2px;
      transform: translateX(-50%);
      white-space: nowrap;
    }
    .arrival-hist .hover {
      position: absolute;
      top: 0;
      bottom: 0;
    }
    .arrival-heat-key {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      vertical-align: middle;
      background: var(--bs-secondary-bg);
    }
  </style>
  <script type="text/javascript">
    window.doraArrivalChart = (function() {
      function esc(s) {
        return String(s).replace(/[&<>"']/g, function(c) {
          return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c];
        });
      }
      function fmtStr(ms) {
        if (ms >= 1000) return (ms / 1000).toFixed(2) + 's';
        return ms + 'ms';
      }
      // Axis bounds are fractional (lo/hi carry float noise), so round to whole ms.
      function fmtAxis(ms) {
        ms = Math.round(ms);
        if (ms < 1000) return ms + 'ms';
        return String(+(ms / 1000).toFixed(2)) + 's';
      }
      // Thresholds and colors are duplicated in FormatArrivalMs in
      // utils/format.go, which colors the same values server side for the
      // epoch page; change both together.
      function timeColor(ms) {
        if (ms < 1000) return '#34c38f';
        if (ms < 2000) return '#7bc96f';
        if (ms < 3000) return '#f1b44c';
        if (ms < 4000) return '#f0824c';
        return '#f46a6a';
      }
      function fmtMsColored(ms) {
        if (ms == null) return '<span class="text-muted">&mdash;</span>';
        return '<span class="num" style="color:' + timeColor(ms) + '">' + fmtStr(ms) + '</span>';
      }
      function liveBadge(settled) {
        if (settled) return '';
        return ' <span class="badge rounded-pill text-bg-info ms-1" style="font-size: 11px;">live &mdash; data may still be arriving</span>';
      }

      var sep = '<span class="text-muted px-2">&middot;</span>';

      function histAxis(axLo, axHi) {
        var span = Math.max(1, axHi - axLo);
        var steps = [10, 25, 50, 100, 250, 500, 1000, 2500, 5000];
        var step = steps[steps.length - 1];

        for (var i = 0; i < steps.length; i++) {
          if (span / steps[i] <= 13) { step = steps[i]; break; }
        }

        var lines = [];
        for (var t = Math.ceil(axLo / step) * step; t < axHi; t += step) {
          if (t > axLo) lines.push(t);
        }

        return { lo: axLo, hi: axHi, span: span, lines: lines };
      }

      var attesterColors = {
        lighthouse: '#8b5cf6', lodestar: '#f1b44c', nimbus: '#50c3e6', prysm: '#5b8def',
        teku: '#f0824c', grandine: '#34c38f', caplin: '#d4a373', silver: '#b8c4d6',
        ethlambda: '#f46a6a', unknown: '#6c757d'
      };
      function mountAttesters(row, body) {
        var attesterSolo = null;
        var attesterData = null;

        function renderAttesters(data) {
          attesterData = data;

          if (!data || !(data.seen || data.other_roots)) return;
          row.style.display = '';

          var slotMs = data.slot_ms || 12000;
          var step = data.bucket_ms || 100;
          var bins = Math.ceil(slotMs / step);
          var clients = data.clients || [];
          var visible = clients.filter(function(c) { return !attesterSolo || attesterSolo === c.name; });
          var totals = [];
          var i;

          for (i = 0; i < bins; i++) totals.push(0);

          visible.forEach(function(c) {
            (c.buckets || []).forEach(function(b) {
              var bin = Math.floor(b.ms / step);
              if (bin < bins) totals[bin] += b.count;
            });
          });

          var peak = Math.max.apply(null, totals.concat([1]));
          var ax = histAxis(0, slotMs);
          var chart = '';

          ax.lines.forEach(function(t) {
            chart += '<div class="grid" style="left:' + (t / slotMs * 100) + '%"></div>';
          });

          var stacked = [];
          var tips = [];

          for (i = 0; i < bins; i++) { stacked.push(0); tips.push([]); }

          visible.forEach(function(c) {
            var color = attesterColors[c.name] || attesterColors.unknown;

            (c.buckets || []).forEach(function(b) {
              var bin = Math.floor(b.ms / step);
              if (bin >= bins) return;

              chart += '<div class="bar" style="left:' + (bin / bins * 100) + '%;width:' + (100 / bins) +
                '%;bottom:' + (stacked[bin] / peak * 100) + '%;height:' + (b.count / peak * 100) +
                '%;background:' + color + '"></div>';
              stacked[bin] += b.count;
              tips[bin].push(c.name + ' ' + b.count);
            });
          });

          [[data.attestation_due_ms, 'attestation deadline'], [data.aggregate_due_ms, 'aggregate deadline']].forEach(function(d) {
            if (!d[0] || d[0] >= slotMs) return;
            chart += '<div class="deadline" style="left:' + (d[0] / slotMs * 100) + '%"><span class="note">' + d[1] + '</span></div>';
          });

          for (i = 0; i < bins; i++) {
            if (!totals[i]) continue;
            chart += '<div class="hover" style="left:' + (i / bins * 100) + '%;width:' + (100 / bins) + '%" title="' +
              esc(fmtStr(i * step) + ' \u2013 ' + fmtStr((i + 1) * step) + ': ' + totals[i] + ' attestations (' + tips[i].join(', ') + ')') + '"></div>';
          }

          var labels = '<span style="left:0;transform:none">0</span>';

          ax.lines.forEach(function(t) {
            labels += '<span style="left:' + (t / slotMs * 100) + '%">' + fmtAxis(t) + '</span>';
          });
          labels += '<span style="left:100%;transform:translateX(-100%)">' + fmtAxis(slotMs) + '</span>';

          var legend = '<table class="table table-sm small mb-0 mt-2" style="width:auto"><thead><tr class="text-muted">' +
            '<th>client</th><th class="text-end">seen</th><th class="text-end">median</th><th class="text-end">p90</th>' +
            '<th class="text-end" title="Attestations first seen after the attestation deadline">after attestation deadline</th>' +
            '<th class="text-end" title="Attestations first seen after the aggregate deadline, too late to be aggregated in time">after aggregate deadline</th>' +
            '<th class="text-end" title="Attestations first seen after the end of the slot">after slot</th></tr></thead><tbody>';

          clients.forEach(function(c) {
            var color = attesterColors[c.name] || attesterColors.unknown;
            var off = attesterSolo && attesterSolo !== c.name;
            var pct = function(n) { return ' <span class="text-muted">(' + (c.seen ? Math.round(n / c.seen * 100) : 0) + '%)</span>'; };

            legend += '<tr class="tl-toggle' + (off ? ' off' : '') + '" data-attester="' + esc(c.name) + '" title="' +
              (attesterSolo === c.name ? 'showing only this client \u2014 click to show all' : 'click to show only this client') + '">' +
              '<td><span class="arrival-heat-key" style="background:' + color + '"></span> ' + esc(c.name) + '</td>' +
              '<td class="text-end num"><b>' + c.seen + '</b>' + (c.expected ? '<span class="text-muted">/' + c.expected + '</span>' : '') + '</td>' +
              '<td class="text-end num">' + (c.seen ? fmtMsColored(c.p50_ms) : '&mdash;') + '</td>' +
              '<td class="text-end num">' + (c.seen ? fmtMsColored(c.p90_ms) : '&mdash;') + '</td>' +
              '<td class="text-end num">' + (c.seen ? c.after_attestation_due + pct(c.after_attestation_due) : '&mdash;') + '</td>' +
              '<td class="text-end num">' + (c.seen ? c.after_due + pct(c.after_due) : '&mdash;') + '</td>' +
              '<td class="text-end num">' + (c.seen ? c.late : '&mdash;') + '</td></tr>';
          });

          legend += '</tbody></table>';

          var stats = '<b>' + data.seen.toLocaleString() + '</b>' +
            (data.expected ? '<span class="text-muted">/' + data.expected.toLocaleString() + '</span>' : '') +
            ' <span class="text-muted">attesters seen, per ' + step + 'ms</span>';

          if (data.other_roots) {
            stats += sep + '<span class="num" style="color:#f46a6a"><b>' + data.other_roots.toLocaleString() +
              '</b></span> <span class="text-muted">vote other roots</span>';
          }

          body.innerHTML = stats + liveBadge(data.settled) +
            '<div class="arrival-hist hist-tall">' + chart + '</div>' +
            '<div class="arrival-hist-axis">' + labels + '</div>' + legend;
        }

        body.addEventListener('click', function(ev) {
          var el = ev.target.closest('[data-attester]');
          if (!el || !attesterData) return;
          var name = el.getAttribute('data-attester');
          attesterSolo = attesterSolo === name ? null : name;
          renderAttesters(attesterData);
        });

        return renderAttesters;
      }

      return {
        esc: esc, fmtStr: fmtStr, fmtAxis: fmtAxis, timeColor: timeColor, fmtMsColored: fmtMsColored,
        liveBadge: liveBadge, sep: sep, histAxis: histAxis, mountAttesters: mountAttesters
      };
    })();
  </script>
{{ end }}
