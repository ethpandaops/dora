{{ define "arrival_chart" }}
  <style>
    .num { font-variant-numeric: tabular-nums; white-space: nowrap; }

    .arrival-hist {
      position: relative;
      height: 110px;
      margin-top: 8px;
      border-left: 1px solid var(--bs-border-color);
      border-bottom: 1px solid var(--bs-border-color);
    }
    .arrival-hist.hist-sm { height: 72px; }
    .arrival-hist.hist-tall { height: 210px; }
    /* legend entries double as series filters */
    .tl-toggle { cursor: pointer; }
    .tl-toggle:hover { text-decoration: underline dotted; text-underline-offset: 3px; }
    .tl-toggle.off { opacity: 0.35; }
    .arrival-faded { opacity: 0.25; }
    .arrival-hist .bar[data-attester] { cursor: pointer; }
    .arrival-hist .bar.dim { opacity: 0.3; }
    .arrival-hist .deadline { pointer-events: none; }
    tr.attester-hover > td { background: var(--bs-tertiary-bg); }
    .arrival-hist .grid {
      position: absolute; top: 0; bottom: 0; width: 1px;
      background: var(--bs-border-color);
      opacity: 0.45;
    }
    .arrival-hist .bar { position: absolute; bottom: 0; }
    .arrival-hist .deadline {
      position: absolute; top: 0; bottom: 0; width: 0;
      border-left: 2px dashed #f46a6a;
      opacity: 0.9;
    }
    .arrival-hist .deadline .note {
      position: absolute;
      top: 1px;
      padding-left: 5px;
      font-size: 0.63rem;
      color: var(--bs-secondary-color);
      white-space: nowrap;
      text-shadow: 0 0 3px var(--bs-body-bg), 0 0 3px var(--bs-body-bg), 0 0 3px var(--bs-body-bg);
    }
    .arrival-hist-axis {
      position: relative;
      height: 0.95rem;
      font-size: 0.63rem;
      color: var(--bs-secondary-color);
      font-variant-numeric: tabular-nums;
    }
    .arrival-hist-axis > span {
      position: absolute;
      top: 2px;
      transform: translateX(-50%);
      white-space: nowrap;
    }
    .arrival-hist .hover {
      position: absolute;
      top: 0;
      bottom: 0;
    }
    .arrival-heat-key {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      vertical-align: middle;
      background: var(--bs-secondary-bg);
    }
  </style>
  <script type="text/javascript">
    window.doraArrivalChart = (function() {
      function esc(s) {
        return String(s).replace(/[&<>"']/g, function(c) {
          return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c];
        });
      }
      function fmtStr(ms) {
        if (ms >= 1000) return (ms / 1000).toFixed(2) + 's';
        return ms + 'ms';
      }
      // Axis bounds are fractional (lo/hi carry float noise), so round to whole ms.
      function fmtAxis(ms) {
        ms = Math.round(ms);
        if (ms < 1000) return ms + 'ms';
        return String(+(ms / 1000).toFixed(2)) + 's';
      }
      // Thresholds and colors are duplicated in FormatArrivalMs in
      // utils/format.go, which colors the same values server side for the
      // epoch page; change both together.
      function timeColor(ms) {
        if (ms < 1000) return '#34c38f';
        if (ms < 2000) return '#7bc96f';
        if (ms < 3000) return '#f1b44c';
        if (ms < 4000) return '#f0824c';
        return '#f46a6a';
      }
      function fmtMsColored(ms) {
        if (ms == null) return '<span class="text-muted">&mdash;</span>';
        return '<span class="num" style="color:' + timeColor(ms) + '">' + fmtStr(ms) + '</span>';
      }
      function liveBadge(settled) {
        if (settled) return '';
        return ' <span class="badge rounded-pill text-bg-info ms-1" style="font-size: 11px;">live &mdash; data may still be arriving</span>';
      }

      var sep = '<span class="text-muted px-2">&middot;</span>';

      function histAxis(axLo, axHi) {
        var span = Math.max(1, axHi - axLo);
        var steps = [10, 25, 50, 100, 250, 500, 1000, 2500, 5000];
        var step = steps[steps.length - 1];

        for (var i = 0; i < steps.length; i++) {
          if (span / steps[i] <= 13) { step = steps[i]; break; }
        }

        var lines = [];
        for (var t = Math.ceil(axLo / step) * step; t < axHi; t += step) {
          if (t > axLo) lines.push(t);
        }

        return { lo: axLo, hi: axHi, span: span, lines: lines };
      }

      var attesterColors = {
        lighthouse: '#8b5cf6', lodestar: '#f1b44c', nimbus: '#50c3e6', prysm: '#5b8def',
        teku: '#f0824c', grandine: '#34c38f', caplin: '#d4a373', silver: '#b8c4d6',
        ethlambda: '#f46a6a', unknown: '#6c757d'
      };
      function mountAttesters(row, body, opts) {
        var attesterSolo = null;
        var attesterData = null;
        var attesterNode = null;
        var nodeDetails = {};

        function nodeValidators(name) {
          var detail = nodeDetails[name];

          if (!detail) return '<span class="text-muted">Loading validators...</span>';
          if (detail.error) return '<span class="text-danger">Failed to load validators: ' + esc(detail.error) + '</span>';
          if (!detail.validators || !detail.validators.length) return '<span class="text-muted">No attestation duties for this node.</span>';

          var rows = '';

          detail.validators.forEach(function(v) {
            var note = '';

            if (!v.seen) note = '<span style="color:#f46a6a">not seen</span>';
            else if (v.seen_ms >= detail.aggregate_due_ms) note = '<span style="color:#f46a6a">after aggregate deadline</span>';
            else if (v.seen_ms >= detail.attestation_due_ms) note = '<span style="color:#f1b44c">after attestation deadline</span>';

            rows += '<tr><td class="num"><a href="/validator/' + v.index + '">' + v.index + '</a></td>' +
              '<td class="num"><a href="/slot/' + v.slot + '">' + v.slot + '</a></td>' +
              '<td class="text-end num">' + (v.seen ? fmtMsColored(v.seen_ms) : '&mdash;') + '</td>' +
              '<td>' + note + '</td></tr>';
          });

          return '<div style="max-height:320px;overflow-y:auto"><table class="table table-sm small mb-0" style="width:auto">' +
            '<thead><tr class="text-muted"><th>validator</th><th>slot</th><th class="text-end">first seen</th><th></th></tr></thead><tbody>' +
            rows + '</tbody></table></div>' +
            (detail.total > detail.validators.length
              ? '<div class="text-muted small">slowest ' + detail.validators.length + ' of ' + detail.total + '</div>' : '');
        }

        function loadNode(name) {
          if (nodeDetails[name] || !opts || !opts.nodeUrl) return;

          fetch(opts.nodeUrl(name))
            .then(function(r) {
              if (!r.ok) throw new Error('status ' + r.status);
              return r.json();
            })
            .catch(function(err) {
              return { error: err.message };
            })
            .then(function(detail) {
              nodeDetails[name] = detail;
              if (attesterNode === name) renderAttesters(attesterData);
            });
        }

        function chartHtml(data, focusNode) {
          var slotMs = data.slot_ms || 12000;
          var step = data.bucket_ms || 100;
          var bins = Math.ceil(slotMs / step);
          var series = [];

          (data.clients || []).forEach(function(c) {
            if (focusNode) {
              (c.nodes || []).forEach(function(n) {
                if (n.name === focusNode) series.push({ client: c.name, label: n.name, buckets: n.buckets || [] });
              });

              return;
            }

            if (!attesterSolo || attesterSolo === c.name) series.push({ client: c.name, label: c.name, buckets: c.buckets || [] });
          });

          var totals = [];
          var i;

          for (i = 0; i < bins; i++) totals.push(0);

          series.forEach(function(sr) {
            sr.buckets.forEach(function(b) {
              var bin = Math.floor(b.ms / step);
              if (bin < bins) totals[bin] += b.count;
            });
          });

          var peak = Math.max.apply(null, totals.concat([1]));
          var chart = '';

          histAxis(0, slotMs).lines.forEach(function(t) {
            chart += '<div class="grid" style="left:' + (t / slotMs * 100) + '%"></div>';
          });

          var stacked = [];

          for (i = 0; i < bins; i++) stacked.push(0);

          series.forEach(function(sr) {
            var color = attesterColors[sr.client] || attesterColors.unknown;

            sr.buckets.forEach(function(b) {
              var bin = Math.floor(b.ms / step);
              if (bin >= bins) return;

              chart += '<div class="bar" data-attester="' + esc(sr.client) + '" style="left:' + (bin / bins * 100) + '%;width:' + (100 / bins) +
                '%;bottom:' + (stacked[bin] / peak * 100) + '%;height:' + (b.count / peak * 100) +
                '%;background:' + color + '" title="' +
                esc(sr.label + ': ' + b.count + ' of ' + totals[bin] + ' attestations at ' + fmtStr(bin * step) + ' \u2013 ' + fmtStr((bin + 1) * step)) + '"></div>';
              stacked[bin] += b.count;
            });
          });

          [[data.attestation_due_ms, 'attestation deadline'], [data.aggregate_due_ms, 'aggregate deadline']].forEach(function(d) {
            if (!d[0] || d[0] >= slotMs) return;
            chart += '<div class="deadline" style="left:' + (d[0] / slotMs * 100) + '%"><span class="note">' + d[1] + '</span></div>';
          });

          return chart;
        }

        function renderAttesters(data) {
          attesterData = data;
          hovered = null;
          hoveredNode = null;

          if (!data || !(data.seen || data.other_roots)) return;
          row.style.display = '';

          var slotMs = data.slot_ms || 12000;
          var step = data.bucket_ms || 100;
          var clients = data.clients || [];
          var chart = chartHtml(data, attesterNode);
          var ax = histAxis(0, slotMs);

          var labels = '<span style="left:0;transform:none">0</span>';

          ax.lines.forEach(function(t) {
            labels += '<span style="left:' + (t / slotMs * 100) + '%">' + fmtAxis(t) + '</span>';
          });
          labels += '<span style="left:100%;transform:translateX(-100%)">' + fmtAxis(slotMs) + '</span>';

          var legend = '<table class="table table-sm small mb-0 mt-2" style="width:auto"><thead><tr class="text-muted">' +
            '<th>client</th><th class="text-end">seen</th><th class="text-end">median</th><th class="text-end">p90</th>' +
            '<th class="text-end" title="Attestations first seen after the attestation deadline">after attestation deadline</th>' +
            '<th class="text-end" title="Attestations first seen after the aggregate deadline, too late to be aggregated in time">after aggregate deadline</th>' +
            '<th class="text-end" title="Attestations first seen after the end of the slot">after slot</th></tr></thead><tbody>';

          var statCells = function(c) {
            var pct = function(n) { return ' <span class="text-muted">(' + (c.seen ? Math.round(n / c.seen * 100) : 0) + '%)</span>'; };

            return '<td class="text-end num"><b>' + c.seen + '</b>' + (c.expected ? '<span class="text-muted">/' + c.expected + '</span>' : '') + '</td>' +
              '<td class="text-end num">' + (c.seen ? fmtMsColored(c.p50_ms) : '&mdash;') + '</td>' +
              '<td class="text-end num">' + (c.seen ? fmtMsColored(c.p90_ms) : '&mdash;') + '</td>' +
              '<td class="text-end num">' + (c.seen ? c.after_attestation_due + pct(c.after_attestation_due) : '&mdash;') + '</td>' +
              '<td class="text-end num">' + (c.seen ? c.after_due + pct(c.after_due) : '&mdash;') + '</td>' +
              '<td class="text-end num">' + (c.seen ? c.late : '&mdash;') + '</td>';
          };

          clients.forEach(function(c) {
            var color = attesterColors[c.name] || attesterColors.unknown;
            var off = attesterSolo && attesterSolo !== c.name;

            legend += '<tr class="tl-toggle' + (off ? ' off' : '') + '" data-attester="' + esc(c.name) + '" title="' +
              (attesterSolo === c.name ? 'showing only this client \u2014 click to show all' : 'click to show only this client and its nodes') + '">' +
              '<td><span class="arrival-heat-key" style="background:' + color + '"></span> ' + esc(c.name) + '</td>' + statCells(c) + '</tr>';

            if (attesterSolo !== c.name) return;

            (c.nodes || []).forEach(function(n) {
              legend += '<tr class="tl-toggle" data-attester-node="' + esc(n.name) + '" title="click to list this node\u2019s validators, slowest first">' +
                '<td class="ps-4 text-muted">' + esc(n.name) + (opts && opts.nodeNote ? opts.nodeNote(n.name) : '') + '</td>' + statCells(n) + '</tr>';

              if (attesterNode === n.name) {
                legend += '<tr><td colspan="7" class="ps-4">' + nodeValidators(n.name) + '</td></tr>';
              }
            });
          });

          legend += '</tbody></table>';

          var stats = '<b>' + data.seen.toLocaleString() + '</b>' +
            (data.expected ? '<span class="text-muted">/' + data.expected.toLocaleString() + '</span>' : '') +
            ' <span class="text-muted">attesters seen, per ' + step + 'ms</span>';

          if (data.other_roots) {
            stats += sep + '<span class="num" style="color:#f46a6a"><b>' + data.other_roots.toLocaleString() +
              '</b></span> <span class="text-muted">vote other roots</span>';
          }

          body.innerHTML = stats + liveBadge(data.settled) +
            '<div class="arrival-hist hist-tall">' + chart + '</div>' +
            '<div class="arrival-hist-axis">' + labels + '</div>' + legend;
        }

        function clientNodes(client) {
          var names = [];

          ((attesterData || {}).clients || []).forEach(function(c) {
            if (c.name !== client) return;
            (c.nodes || []).forEach(function(n) { names.push(n.name); });
          });

          return names;
        }

        function soloNodes() {
          return clientNodes(attesterSolo);
        }

        var hovered = null;

        function hoverClient(name) {
          if (name === hovered) return;
          hovered = name;

          body.querySelectorAll('[data-attester]').forEach(function(el) {
            var match = el.getAttribute('data-attester') === name;

            if (el.classList.contains('bar')) el.classList.toggle('dim', !!name && !match);
            else el.classList.toggle('attester-hover', !!name && match);
          });

          if (opts && opts.onHover) opts.onHover(name, name ? clientNodes(name) : []);
        }

        var hoveredNode = null;

        function hoverNode(name) {
          if (name === hoveredNode) return;
          hoveredNode = name;

          var hist = body.querySelector('.arrival-hist');
          if (hist && attesterData) hist.innerHTML = chartHtml(attesterData, name || attesterNode);

          if (opts && opts.onNodeHover) opts.onNodeHover(name);
        }

        body.addEventListener('mouseover', function(ev) {
          var node = ev.target.closest('[data-attester-node]');
          hoverNode(node ? node.getAttribute('data-attester-node') : null);

          var el = ev.target.closest('[data-attester]');
          hoverClient(el ? el.getAttribute('data-attester') : null);
        });

        body.addEventListener('mouseleave', function() {
          hoverNode(null);
          hoverClient(null);
        });

        body.addEventListener('click', function(ev) {
          if (!attesterData) return;

          var nodeEl = ev.target.closest('[data-attester-node]');
          if (nodeEl) {
            var node = nodeEl.getAttribute('data-attester-node');
            attesterNode = attesterNode === node ? null : node;
            if (opts && opts.onNode) opts.onNode(attesterNode);
            if (attesterNode) loadNode(attesterNode);
            renderAttesters(attesterData);

            return;
          }

          var el = ev.target.closest('[data-attester]');
          if (!el) return;
          var name = el.getAttribute('data-attester');
          attesterSolo = attesterSolo === name ? null : name;
          attesterNode = null;
          renderAttesters(attesterData);
          if (opts && opts.onNode) opts.onNode(null);
          if (opts && opts.onSolo) opts.onSolo(attesterSolo, soloNodes());
        });

        document.addEventListener('click', function(ev) {
          if (!attesterSolo || !attesterData) return;
          if (ev.target.closest('[data-attester], [data-attester-node], a, button, input, select, [data-sort], [data-tlseries]')) return;
          if (body.contains(ev.target) && ev.target.closest('table')) return;

          attesterSolo = null;
          attesterNode = null;
          renderAttesters(attesterData);
          if (opts && opts.onNode) opts.onNode(null);
          if (opts && opts.onSolo) opts.onSolo(null, []);
        });

        return renderAttesters;
      }


      function plural(n, word) {
        return n.toLocaleString() + ' ' + word + (n === 1 ? '' : 's');
      }
      function fmtDelta(ms) {
        return (ms < 0 ? '&minus;' : '+') + fmtStr(Math.abs(ms));
      }
      function fmtBytes(n) {
        if (n >= 1048576) return (n / 1048576).toFixed(1) + ' MB';
        if (n >= 1024) return Math.round(n / 1024) + ' kB';
        return n + ' B';
      }
      function clientColor(name) {
        return attesterColors[name] || attesterColors.unknown;
      }

      function aggregateLanes(data) {
        var aggregates = data.aggregates;
        var lanes = {};
        var maxMs = data.slot_ms;

        aggregates.forEach(function(a) {
          (lanes[a.committee_index] = lanes[a.committee_index] || []).push(a);
          if (a.seen) maxMs = Math.max(maxMs, a.seen_ms + 250);
        });

        var keys = Object.keys(lanes).map(Number).sort(function(a, b) { return a - b; });
        var left = 70, width = 900, laneH = 22, top = 4;
        var height = top + keys.length * laneH + 18;
        var x = function(ms) { return left + Math.min(ms, maxMs) / maxMs * width; };
        var svg = '<svg viewBox="0 0 ' + (left + width + 10) + ' ' + height + '" style="width:100%;max-width:980px;height:auto" class="arrival-aggregate-lanes">';

        [[data.attestation_due_ms, 'attestation deadline', '4 3'], [data.aggregate_due_ms, 'aggregate deadline', ''], [data.slot_ms, 'slot end', '1 3']].forEach(function(line) {
          if (!line[0]) return;
          svg += '<line x1="' + x(line[0]) + '" x2="' + x(line[0]) + '" y1="' + top + '" y2="' + (height - 16) + '" stroke="var(--bs-secondary-color)" stroke-width="1"' +
            (line[2] ? ' stroke-dasharray="' + line[2] + '"' : '') + '><title>' + line[1] + ' ' + fmtStr(line[0]) + '</title></line>';
        });

        keys.forEach(function(committee, i) {
          var y = top + i * laneH + laneH / 2;
          svg += '<rect x="' + left + '" y="' + (y - laneH / 2 + 2) + '" width="' + width + '" height="' + (laneH - 4) + '" fill="var(--bs-secondary-bg)" opacity="0.5"></rect>';
          svg += '<text x="' + (left - 6) + '" y="' + (y + 4) + '" text-anchor="end" font-size="11" fill="var(--bs-secondary-color)">committee ' + committee + '</text>';

          lanes[committee].forEach(function(a) {
            var label = 'aggregator ' + a.aggregator_index + (a.aggregator_name ? ' (' + a.aggregator_name + ')' : '');

            if (!a.seen) {
              svg += '<text x="' + (left + width + 2) + '" y="' + (y + 4) + '" font-size="12" fill="#f46a6a"><title>' + esc(label) + ': no aggregate seen</title>&#10005;</text>';
              return;
            }

            var pct = a.committee_size ? Math.round(a.attesters * 100 / a.committee_size) + '%' : a.attesters;
            svg += '<circle cx="' + x(a.seen_ms) + '" cy="' + y + '" r="5" fill="' + clientColor(a.client) + '" stroke="var(--bs-body-bg)" stroke-width="1"><title>' +
              esc(label + ' · ' + a.client + ' · ' + fmtStr(a.seen_ms) + ' · ' + pct + ' of the committee') + '</title></circle>';
          });
        });

        for (var t = 0; t <= maxMs; t += 1000) {
          svg += '<text x="' + x(t) + '" y="' + (height - 4) + '" text-anchor="middle" font-size="10" fill="var(--bs-secondary-color)">' + (t / 1000) + 's</text>';
        }

        return svg + '</svg>';
      }

      function renderSlotAggregates(row, body, data) {
        var aggregates = (data && data.aggregates) || [];

        if (!aggregates.length) {
          row.style.display = 'none';
          return;
        }

        var dueMs = data.aggregate_due_ms;
        var seen = aggregates.filter(function(a) { return a.seen; });
        var missing = aggregates.filter(function(a) { return !a.seen; });
        var hasElected = aggregates.some(function(a) { return a.elected != null; });
        var committees = {};
        var bytes = 0;

        aggregates.forEach(function(a) { committees[a.committee_index] = true; bytes += a.size_bytes || 0; });

        var summary = plural(seen.length, 'aggregate') + ' over ' + plural(Object.keys(committees).length, 'committee');

        if (seen.length) {
          var firstMs = Math.min.apply(null, seen.map(function(a) { return a.seen_ms; }));
          summary += sep + 'first ' + fmtStr(firstMs) + ' (' + fmtDelta(firstMs - dueMs) + ' vs the aggregate deadline)';
        }

        if (data.aggregate_members) summary += sep + Math.round(data.aggregate_covered * 100 / data.aggregate_members) + '% of committee members covered';
        if (bytes) summary += sep + fmtBytes(bytes) + ' of aggregates';
        if (missing.length) summary += sep + '<span style="color:#f46a6a">' + plural(missing.length, 'elected aggregator') + ' sent none</span>';
        summary += liveBadge(data.settled);

        var rows = '';

        aggregates.forEach(function(a) {
          var name = a.aggregator_name ? ' <span class="text-muted">' + esc(a.aggregator_name) + '</span>' : '';
          var cells = '<td class="num">' + a.committee_index + '</td>' +
            '<td class="num"><a href="/validator/' + a.aggregator_index + '">' + a.aggregator_index + '</a>' + name + '</td>' +
            '<td><span class="arrival-heat-key" style="background:' + clientColor(a.client) + '"></span> ' + esc(a.client) + '</td>' +
            (hasElected ? '<td>' + (a.elected ? 'yes' : '<span style="color:#f1b44c">no</span>') + '</td>' : '');

          if (!a.seen) {
            rows += '<tr>' + cells + '<td colspan="8"><span style="color:#f46a6a">no aggregate seen</span></td></tr>';
            return;
          }

          var pct = a.committee_size ? ' <span class="text-muted">(' + Math.round(a.attesters * 100 / a.committee_size) + '%)</span>' : '';

          rows += '<tr>' + cells +
            '<td class="text-end num"' + (a.seen_ms >= data.slot_ms ? ' style="color:#f46a6a"' : '') + '>' + fmtStr(a.seen_ms) + '</td>' +
            '<td class="text-end num">' + fmtDelta(a.seen_ms - dueMs) + '</td>' +
            '<td class="text-end num">' + (a.observers > 1 ? fmtStr(a.observers_p50_ms) + ' <span class="text-muted">(' + a.observers + ')</span>' : '&mdash;') + '</td>' +
            '<td class="text-end num">' + a.attesters.toLocaleString() + (a.committee_size ? ' / ' + a.committee_size.toLocaleString() : '') + pct + '</td>' +
            '<td class="text-end num">' + (a.attesters > a.included_unseen ? fmtStr(a.last_included_ms) : '&mdash;') + '</td>' +
            '<td class="text-end num">' + (a.left_out ? '<span style="color:#f1b44c">' + a.left_out + '</span>' : '0') + '</td>' +
            '<td class="text-end num">' + a.included_unseen + '</td>' +
            '<td class="text-end num">' + (a.size_bytes ? fmtBytes(a.size_bytes) : '&mdash;') + '</td></tr>';
        });

        body.innerHTML = '<div class="mb-1">' + summary + '</div>' + aggregateLanes(data) +
          '<div class="table-responsive"><table class="table table-sm arrival-table text-left mb-1" style="width:auto"><thead><tr class="text-muted">' +
          '<th>committee</th><th>aggregator</th><th>client</th>' + (hasElected ? '<th>elected</th>' : '') +
          '<th class="text-end">first seen</th><th class="text-end">vs deadline</th><th class="text-end" title="Median first arrival over the nodes whose beacon API reported the aggregate, and how many did">p50 (nodes)</th>' +
          '<th class="text-end">attesters</th><th class="text-end">last single</th><th class="text-end">left out</th><th class="text-end">unseen</th><th class="text-end">size</th>' +
          '</tr></thead><tbody>' + rows + '</tbody></table></div>';
        row.style.display = '';
      }

      function renderEpochAggregates(row, body, data) {
        var agg = data && data.aggregates;

        if (!agg || !agg.aggregates) {
          row.style.display = 'none';
          return;
        }

        var dueMs = data.aggregate_due_ms;
        var summary = plural(agg.aggregates, 'aggregate') + ' over ' + plural(agg.slots.length, 'slot');
        if (agg.members) summary += sep + Math.round(agg.covered * 100 / agg.members) + '% of committee members covered';
        if (agg.size_bytes) summary += sep + fmtBytes(agg.size_bytes) + ' of aggregates';
        if (agg.missing) summary += sep + '<span style="color:#f46a6a">' + plural(agg.missing, 'elected aggregator') + ' sent none</span>';
        summary += liveBadge(data.settled);

        var cells = '';

        agg.slots.forEach(function(s) {
          var cover = s.members ? Math.round(s.covered * 100 / s.members) : 0;
          var title = 'slot ' + s.slot + ': ' + plural(s.aggregates, 'aggregate') +
            (s.first_ms != null ? ', first ' + fmtStr(s.first_ms) + ' (' + (s.first_ms - dueMs >= 0 ? '+' : '-') + fmtStr(Math.abs(s.first_ms - dueMs)) + ' vs deadline)' : '') +
            (s.members ? ', ' + cover + '% covered' : '') + (s.missing ? ', ' + plural(s.missing, 'elected aggregator') + ' sent none' : '');
          var bg = s.first_ms != null ? timeColor(Math.max(0, s.first_ms - dueMs)) : 'var(--bs-secondary-bg)';

          cells += '<a href="/slot/' + s.slot + '#propagation" title="' + esc(title) + '" style="display:inline-block;width:26px;height:26px;margin:1px;border-radius:3px;background:' + bg +
            ';opacity:' + (s.first_ms != null ? Math.max(0.35, cover / 100) : 1) + ';' + (s.missing ? 'box-shadow:inset 0 0 0 2px #f46a6a;' : '') + '"></a>';
        });

        var rows = '';

        agg.clients.forEach(function(c) {
          rows += '<tr><td><span class="arrival-heat-key" style="background:' + clientColor(c.name) + '"></span> ' + esc(c.name) + '</td>' +
            '<td class="text-end num">' + c.aggregates.toLocaleString() + '</td>' +
            '<td class="text-end num">' + (c.missing ? '<span style="color:#f46a6a">' + c.missing + '</span>' : '0') + '</td>' +
            '<td class="text-end num">' + (c.aggregates ? fmtStr(c.p50_ms) + ' <span class="text-muted">(' + fmtDelta(c.p50_ms - dueMs) + ')</span>' : '&mdash;') + '</td>' +
            '<td class="text-end num">' + (c.aggregates ? fmtStr(c.p90_ms) : '&mdash;') + '</td>' +
            '<td class="text-end num">' + (c.late ? '<span style="color:#f1b44c">' + c.late + '</span>' : '0') + '</td>' +
            '<td class="text-end num">' + (c.committee_members ? Math.round(c.attesters * 100 / c.committee_members) + '%' : '&mdash;') + '</td></tr>';
        });

        body.innerHTML = '<div class="mb-1">' + summary + '</div>' +
          '<div class="mb-2" style="line-height:0">' + cells + '</div>' +
          '<div class="table-responsive"><table class="table table-sm arrival-table text-left mb-1" style="width:auto"><thead><tr class="text-muted">' +
          '<th>aggregator client</th><th class="text-end">aggregates</th><th class="text-end">sent none</th><th class="text-end">p50 first seen</th>' +
          '<th class="text-end">p90</th><th class="text-end" title="First seen more than 1s after the aggregate deadline">late</th><th class="text-end">avg attesters</th>' +
          '</tr></thead><tbody>' + rows + '</tbody></table></div>';
        row.style.display = '';
      }

      return {
        esc: esc, fmtStr: fmtStr, fmtAxis: fmtAxis, timeColor: timeColor, fmtMsColored: fmtMsColored,
        liveBadge: liveBadge, sep: sep, histAxis: histAxis, mountAttesters: mountAttesters,
        renderSlotAggregates: renderSlotAggregates, renderEpochAggregates: renderEpochAggregates
      };
    })();
  </script>
{{ end }}
