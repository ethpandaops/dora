# The wasm32 build of the ere zkVM verifiers Dora embeds; built by the
# Dockerfile next to this crate inside an ere checkout (see build.sh).
[package]
name = "ere-verifier-wasm"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
ere-verifier-core = { path = "../core" }
ere-verifier-sp1 = { path = "../sp1" }
ere-verifier-zisk = { path = "../zisk" }
ere-verifier-openvm = { path = "../openvm" }
# the verifiers never draw randomness; the custom backends answer for them.
# Pinned to the versions in ere's lockfile so the build resolves nothing new.
getrandom02 = { package = "getrandom", version = "=0.2.17", features = ["custom"] }
getrandom03 = { package = "getrandom", version = "=0.3.4" }
