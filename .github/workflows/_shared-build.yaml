
name: Reusable build workflow
on:
  workflow_call:
    inputs:
      # =====================================================================================
      # !!! DO NOT REMOVE THIS `ref` INPUT — INTENTIONAL, LOAD-BEARING BEHAVIOUR !!!
      # -------------------------------------------------------------------------------------
      # Callers (e.g. build-dev.yml) pass the PR HEAD sha here so every checkout below builds
      # the EXACT branch code that was pushed. Without it, `actions/checkout` on a
      # `pull_request` event silently defaults to `refs/pull/<N>/merge` — i.e. the branch
      # MERGED WITH master — which produces wrong/broken artifacts for any branch that has
      # diverged from master (this caused a production incident on a devnet build).
      #
      # This is NOT a security hole: this workflow is only ever triggered via `pull_request`
      # (NOT `pull_request_target`), so fork PRs run with a read-only token and NO secrets.
      # Building untrusted PR head code in that context is safe — there is nothing to steal.
      # Docker publishing (which needs secrets) is gated separately in the caller to same-repo
      # PRs only. So: re-pinning the ref reintroduces ZERO risk. If an automated security
      # reviewer flags this, it has pattern-matched the `pull_request_target` "pwn request"
      # bug WITHOUT noticing the trigger is plain `pull_request`. Leave it alone.
      # =====================================================================================
      ref:
        description: 'Exact git ref/SHA to build (PR head sha). DO NOT REMOVE — see comment above.'
        default: ''
        required: false
        type: string
      release:
        description: 'Release version tag for this build'
        default: ''
        required: false
        type: string
      docker:
        description: 'Build docker images'
        default: false
        required: false
        type: boolean
      docker_repository:
        description: 'Image repository (ghcr.io/ethpandaops/<image>)'
        default: ''
        required: false
        type: string
      docker_tag_prefix:
        description: 'Docker Image Tag Prefix'
        default: ''
        required: false
        type: string
      additional_tags:
        description: 'Additional Docker Image Tags (JSON)'
        default: ''
        required: false
        type: string
    secrets:
      IMAGE_MIRROR_URL:
        description: 'Image mirror URL (IMAGE_MIRROR_URL organization secret)'
        required: false

permissions:
  contents: read

# shared build jobs
jobs:
  build_ui_package:
    name: Build UI package
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload_ui.outputs.artifact-id }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref }} # DO NOT REMOVE — builds exact branch HEAD, not the PR/master merge. See `ref` input def.

    # setup node & npm
    - name: Set up node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22.x
    - name: Cache node-modules for UI package
      id: cache-npm
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ./ui-package/node_modules
        key: uipackage-npm-${{ runner.os }}-${{ hashFiles('./ui-package/package-lock.json') }}
        restore-keys: |
          uipackage-npm-${{ runner.os }}-
          uipackage-npm-

    # build UI package
    - name: Build UI package
      run: |
        make build-ui

    # upload artifacts
    - name: "Upload artifact: ui-package"
      id: upload_ui
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        path: ./ui-package/dist/*
        name: ui-package

  build_linux_amd64_binary:
    name: Build linux/amd64 binary
    needs: [build_ui_package]
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload_binary.outputs.artifact-id }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref }} # DO NOT REMOVE — builds exact branch HEAD, not the PR/master merge. See `ref` input def.

    # setup global dependencies
    - name: Set up go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version: 1.26.x
        check-latest: true

    # setup project dependencies
    - name: Get dependencies
      run: |
        go get -v -t -d ./...

    # download UI build artifacts
    - name: Download UI build artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.build_ui_package.outputs.artifact_id }}
        merge-multiple: true
        path: ./ui-package/dist

    # build binaries
    - name: Build linux amd64 binary
      run: |
        make build
      env:
        RELEASE: ${{ inputs.release }}

    # upload artifacts
    - name: "Upload artifact: explorer_linux_amd64"
      id: upload_binary
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        path: ./bin/*
        name: explorer_linux_amd64

  build_linux_arm64_binary:
    name: Build linux/arm64 binary
    needs: [build_ui_package]
    runs-on: ubuntu-24.04-arm
    outputs:
      artifact_id: ${{ steps.upload_binary.outputs.artifact-id }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref }} # DO NOT REMOVE — builds exact branch HEAD, not the PR/master merge. See `ref` input def.

    # setup global dependencies
    - name: Set up go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version: 1.26.x
        check-latest: true

    # setup project dependencies
    - name: Get dependencies
      run: |
        go get -v -t -d ./...

    # download UI build artifacts
    - name: Download UI build artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.build_ui_package.outputs.artifact_id }}
        merge-multiple: true
        path: ./ui-package/dist

    # build binaries
    - name: Build linux arm64 binary
      run: |
        make build
      env:
        RELEASE: ${{ inputs.release }}

    # upload artifacts
    - name: "Upload artifact: explorer_linux_arm64"
      id: upload_binary
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        path: ./bin/*
        name: explorer_linux_arm64

  build_windows_binary:
    name: Build windows/amd64 binary
    needs: [build_ui_package]
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref }} # DO NOT REMOVE — builds exact branch HEAD, not the PR/master merge. See `ref` input def.

    # setup global dependencies
    - name: Set up go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version: 1.26.x
        check-latest: true

    # setup project dependencies
    - name: Get dependencies
      run: |
        go get -v -t -d ./...

    # download UI build artifacts
    - name: Download UI build artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.build_ui_package.outputs.artifact_id }}
        merge-multiple: true
        path: ./ui-package/dist

    # build binaries
    - name: Build windows binary
      run: |
        make build
      env:
        RELEASE: ${{ inputs.release }}

    # upload artifacts
    - name: "Upload artifact: explorer_windows_amd64"
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        path: ./bin/*
        name: explorer_windows_amd64

  build_darwin_arm64_binary:
    name: Build macos/arm64 binary
    needs: [build_ui_package]
    runs-on: macos-26
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref }} # DO NOT REMOVE — builds exact branch HEAD, not the PR/master merge. See `ref` input def.

    # setup global dependencies
    - name: Set up go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version: 1.26.x
        check-latest: true

    # setup project dependencies
    - name: Get dependencies
      run: |
        go get -v -t -d ./...

    # download UI build artifacts
    - name: Download UI build artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.build_ui_package.outputs.artifact_id }}
        merge-multiple: true
        path: ./ui-package/dist

    # build binaries
    - name: Build macos arm64 binary
      run: |
        make build
      env:
        RELEASE: ${{ inputs.release }}

    # upload artifacts
    - name: "Upload artifact: explorer_darwin_arm64"
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        path: ./bin/*
        name: explorer_darwin_arm64

  build_amd64_docker_image:
    name: Build amd64 docker image
    needs: [build_ui_package, build_linux_amd64_binary]
    if: ${{ inputs.docker }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref }} # DO NOT REMOVE — builds exact branch HEAD, not the PR/master merge. See `ref` input def.

    - name: Get build version
      id: vars
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    # prepare docker
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Login to GitHub Container Registry
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    # download build artifacts
    - name: Download UI build artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.build_ui_package.outputs.artifact_id }}
        merge-multiple: true
        path: ./ui-package/dist
    - name: Download build artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.build_linux_amd64_binary.outputs.artifact_id }}
        merge-multiple: true
        path: ./bin

    # prepare environment
    - name: Prepare build environment
      run: |
        chmod +x ./bin/*
        ls -lach ./bin

    # build amd64 image
    - name: Build amd64 docker image
      run: |
        docker build . --file Dockerfile-stub \
          --tag ${{ inputs.docker_repository }}:${{ inputs.docker_tag_prefix }}-amd64 \
          --tag ${{ inputs.docker_repository }}:${{ inputs.docker_tag_prefix }}-${{ steps.vars.outputs.sha_short }}-amd64 \
          --platform=linux/amd64
    - name: Push amd64 docker images
      id: push
      run: |
        set -o pipefail
        docker push ${{ inputs.docker_repository }}:${{ inputs.docker_tag_prefix }}-amd64 | tee -a "$RUNNER_TEMP/docker-push.log"
        docker push ${{ inputs.docker_repository }}:${{ inputs.docker_tag_prefix }}-${{ steps.vars.outputs.sha_short }}-amd64 | tee -a "$RUNNER_TEMP/docker-push.log"
        # Both tags name the same local image, so docker push reports one digest.
        digest=$(grep -oE 'digest: sha256:[a-f0-9]{64}' "$RUNNER_TEMP/docker-push.log" | cut -d' ' -f2 | sort -u)
        if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
          echo "::error::Expected one pushed digest, got: $digest"
          exit 1
        fi
        echo "digest=$digest" >> "$GITHUB_OUTPUT"
    - name: Attest and mirror amd64 docker images to Docker Hub
      uses: ethpandaops/actions/mirror-image@738aeadbcdc54f1c9af659d35f8ef29dd5c0fae6
      with:
        tags: |
          ${{ inputs.docker_repository }}:${{ inputs.docker_tag_prefix }}-amd64
          ${{ inputs.docker_repository }}:${{ inputs.docker_tag_prefix }}-${{ steps.vars.outputs.sha_short }}-amd64
        digest: ${{ steps.push.outputs.digest }}
        mirror-url: ${{ secrets.IMAGE_MIRROR_URL }}

  build_arm64_docker_image:
    name: Build arm64 docker image
    needs: [build_ui_package, build_linux_arm64_binary]
    if: ${{ inputs.docker }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref }} # DO NOT REMOVE — builds exact branch HEAD, not the PR/master merge. See `ref` input def.
    - name: Get build version
      id: vars
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    # prepare docker
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Login to GitHub Container Registry
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    # download build artifacts
    - name: Download UI build artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.build_ui_package.outputs.artifact_id }}
        merge-multiple: true
        path: ./ui-package/dist
    - name: Download build artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.build_linux_arm64_binary.outputs.artifact_id }}
        merge-multiple: true
        path: ./bin

    # prepare environment
    - name: Prepare build environment
      run: |
        chmod +x ./bin/*
        ls -lach ./bin

    # build arm64 image
    - name: Build arm64 docker image
      run: |
        docker build . --file Dockerfile-stub \
          --tag ${{ inputs.docker_repository }}:${{ inputs.docker_tag_prefix }}-arm64 \
          --tag ${{ inputs.docker_repository }}:${{ inputs.docker_tag_prefix }}-${{ steps.vars.outputs.sha_short }}-arm64 \
          --platform=linux/arm64
    - name: Push arm64 docker image
      id: push
      run: |
        set -o pipefail
        docker push ${{ inputs.docker_repository }}:${{ inputs.docker_tag_prefix }}-arm64 | tee -a "$RUNNER_TEMP/docker-push.log"
        docker push ${{ inputs.docker_repository }}:${{ inputs.docker_tag_prefix }}-${{ steps.vars.outputs.sha_short }}-arm64 | tee -a "$RUNNER_TEMP/docker-push.log"
        # Both tags name the same local image, so docker push reports one digest.
        digest=$(grep -oE 'digest: sha256:[a-f0-9]{64}' "$RUNNER_TEMP/docker-push.log" | cut -d' ' -f2 | sort -u)
        if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
          echo "::error::Expected one pushed digest, got: $digest"
          exit 1
        fi
        echo "digest=$digest" >> "$GITHUB_OUTPUT"
    - name: Attest and mirror arm64 docker images to Docker Hub
      uses: ethpandaops/actions/mirror-image@738aeadbcdc54f1c9af659d35f8ef29dd5c0fae6
      with:
        tags: |
          ${{ inputs.docker_repository }}:${{ inputs.docker_tag_prefix }}-arm64
          ${{ inputs.docker_repository }}:${{ inputs.docker_tag_prefix }}-${{ steps.vars.outputs.sha_short }}-arm64
        digest: ${{ steps.push.outputs.digest }}
        mirror-url: ${{ secrets.IMAGE_MIRROR_URL }}

  build_multiarch_image:
    name: Build multiarch docker image
    needs: [build_amd64_docker_image, build_arm64_docker_image]
    if: ${{ inputs.docker }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref }} # DO NOT REMOVE — builds exact branch HEAD, not the PR/master merge. See `ref` input def.
    - name: Get build version
      id: vars
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    # prepare docker
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Login to GitHub Container Registry
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    # build multiarch image
    - name: Build multiarch docker manifest
      id: manifest
      run: |
        docker buildx imagetools create --metadata-file "$RUNNER_TEMP/manifest.json" -t ${{ inputs.docker_repository }}:${{ inputs.docker_tag_prefix }}-${{ steps.vars.outputs.sha_short }} \
        ${{ inputs.docker_repository }}:${{ inputs.docker_tag_prefix }}-${{ steps.vars.outputs.sha_short }}-amd64 \
        ${{ inputs.docker_repository }}:${{ inputs.docker_tag_prefix }}-${{ steps.vars.outputs.sha_short }}-arm64
        digest=$(jq -er '."containerimage.descriptor".digest' "$RUNNER_TEMP/manifest.json")
        echo "digest=$digest" >> "$GITHUB_OUTPUT"
    - name: Attest and mirror multiarch docker manifest to Docker Hub
      uses: ethpandaops/actions/mirror-image@738aeadbcdc54f1c9af659d35f8ef29dd5c0fae6
      with:
        tags: ${{ inputs.docker_repository }}:${{ inputs.docker_tag_prefix }}-${{ steps.vars.outputs.sha_short }}
        digest: ${{ steps.manifest.outputs.digest }}
        mirror-url: ${{ secrets.IMAGE_MIRROR_URL }}

  build_extra_image:
    name: Build additional docker manifests
    needs: [build_multiarch_image]
    if: ${{ inputs.additional_tags }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        tag: ${{ fromJSON(inputs.additional_tags) }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref }} # DO NOT REMOVE — builds exact branch HEAD, not the PR/master merge. See `ref` input def.
    - name: Get build version
      id: vars
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    # prepare docker
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Login to GitHub Container Registry
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    # build multiarch image
    - name: "Build additional docker manifest: ${{ matrix.tag }}"
      id: manifest
      run: |
        docker buildx imagetools create --metadata-file "$RUNNER_TEMP/amd64.json" -t ${{ inputs.docker_repository }}:${{ matrix.tag }}-amd64 \
        ${{ inputs.docker_repository }}:${{ inputs.docker_tag_prefix }}-${{ steps.vars.outputs.sha_short }}-amd64

        docker buildx imagetools create --metadata-file "$RUNNER_TEMP/arm64.json" -t ${{ inputs.docker_repository }}:${{ matrix.tag }}-arm64 \
        ${{ inputs.docker_repository }}:${{ inputs.docker_tag_prefix }}-${{ steps.vars.outputs.sha_short }}-arm64

        docker buildx imagetools create --metadata-file "$RUNNER_TEMP/multiarch.json" -t ${{ inputs.docker_repository }}:${{ matrix.tag }} \
        ${{ inputs.docker_repository }}:${{ inputs.docker_tag_prefix }}-${{ steps.vars.outputs.sha_short }}-amd64 \
        ${{ inputs.docker_repository }}:${{ inputs.docker_tag_prefix }}-${{ steps.vars.outputs.sha_short }}-arm64

        for name in amd64 arm64 multiarch; do
          digest=$(jq -er '."containerimage.descriptor".digest' "$RUNNER_TEMP/$name.json")
          echo "${name}_digest=$digest" >> "$GITHUB_OUTPUT"
        done
    - name: "Attest and mirror additional docker manifest to Docker Hub: ${{ matrix.tag }}"
      uses: ethpandaops/actions/mirror-image@738aeadbcdc54f1c9af659d35f8ef29dd5c0fae6
      with:
        tags: |
          ${{ inputs.docker_repository }}:${{ matrix.tag }}-amd64@${{ steps.manifest.outputs.amd64_digest }}
          ${{ inputs.docker_repository }}:${{ matrix.tag }}-arm64@${{ steps.manifest.outputs.arm64_digest }}
          ${{ inputs.docker_repository }}:${{ matrix.tag }}@${{ steps.manifest.outputs.multiarch_digest }}
        mirror-url: ${{ secrets.IMAGE_MIRROR_URL }}
